name: Refresh mandi prices

on:
  schedule:
    # UTC: 02:45 and 12:45 = 08:15 and 18:15 India time, every day.
    - cron: '45 2,12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mandi-report-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: python
    steps:
      - name: Check out default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ml/refresh-requirements.txt

      - name: Install refresh dependencies
        shell: pwsh
        run: python -m pip install -r ml/refresh-requirements.txt

      - name: Check one-time secret configuration
        env:
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          import os
          from ml.trigger_price_deploy import configured_hook
          if not os.environ.get('DATA_GOV_IN_API_KEY', '').strip():
              raise SystemExit('Add DATA_GOV_IN_API_KEY in repository Settings > Secrets and variables > Actions.')
          try:
              configured_hook()
          except ValueError:
              raise SystemExit('Add a valid Vercel Deploy Hook as repository secret VERCEL_DEPLOY_HOOK.')

      - name: Fetch and validate official Telangana report
        shell: pwsh
        env:
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
        run: python -m ml.refresh_prices

      # A failed refresh stops the job BEFORE committing or requesting a deploy.
      - name: Commit and push only the validated report
        id: publish
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          import os, subprocess
          def git(*args):
              return subprocess.run(['git', *args], check=True)
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          git('add', '--', 'data/mandi_prices.json')
          changed = subprocess.run(['git', 'diff', '--cached', '--quiet', '--', 'data/mandi_prices.json']).returncode
          if changed not in (0, 1):
              raise SystemExit('Could not inspect the report change.')
          if changed:
              git('commit', '-m', 'Refresh official Telangana mandi report', '--', 'data/mandi_prices.json')
              git('push', 'origin', 'HEAD:refs/heads/' + os.environ['TARGET_BRANCH'])
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('changed=' + ('true' if changed else 'false') + '\n')

      - name: Request Vercel deployment of the updated branch
        if: steps.publish.outputs.changed == 'true'
        shell: pwsh
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: python -m ml.trigger_price_deploy
